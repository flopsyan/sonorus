name: sonorus

services:
  sonorus:
    build: .
    image: sonorus:latest
    container_name: sonorus
    restart: unless-stopped
    ports:
      # Host port is configurable via .env (PORT), default 3000
      - "${PORT:-3000}:3000"
    environment:
      SITE_NAME: ${SITE_NAME:-Sonorus}
      NODE_ENV: production
      # Path inside the container - the host path comes from the volume below.
      MUSIC_DIR: /music
      # auto (scan when the library is empty) | always | never
      SCAN_ON_START: ${SCAN_ON_START:-auto}
      # Optional: bootstrap the first admin account non-interactively. If left
      # empty, the first start shows a one-time setup page to create the admin.
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      # Optional: secret for signing session cookies. If empty, a random one is
      # generated and stored in the database (stable across restarts).
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Reverse proxies in front of the app (see .env.example). Set to false
      # when the port is exposed directly without a reverse proxy.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes:
      # Your music folder, mounted read-only: Sonorus never writes to it.
      - "${MUSIC_DIR:-./music}:/music:ro"
      # Persistent data: SQLite database + extracted cover art
      - sonorus-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sonorus-data:
